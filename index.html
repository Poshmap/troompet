<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>troompet — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      font-family: 'Avenir Next', 'Avenir', 'Nunito', sans-serif;
    }

    /* ── BACKGROUND: sfondo.jpg blurred + gradient overlay ── */
    .bg {
      position: fixed;
      inset: -40px; /* compensate blur edge */
      background: url('sfondo.jpg') center center / cover no-repeat;
      filter: blur(16px) brightness(1.20);
      z-index: 0;
    }

    /* Gradient: nero→arancio→nero, sfrutta i colori dell'immagine */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(to bottom,
          rgba(0,0,0,0.88) 0%,
          rgba(0,0,0,0.30) 38%,
          rgba(0,0,0,0.12) 52%,
          rgba(0,0,0,0.30) 65%,
          rgba(0,0,0,0.88) 100%
        );
    }

    /* ── PAGE ── */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100dvh; /* dynamic vh: esclude chrome del browser mobile */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(60px, 10vh, 100px) 24px clamp(60px, 10vh, 100px);
      text-align: center;
      gap: clamp(36px, 6vh, 60px);
    }

    /* ── LOGO ── */
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* mix-blend-mode: screen elimina il bordo nero del gif */
    .logo-area img.logo-gif {
      width: clamp(100px, 22vw, 180px);
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 28px rgba(242, 209, 102, 0.5))
              drop-shadow(0 0 70px rgba(227, 170, 104, 0.25));
    }

    .logo-area img.logo-wordmark {
      width: clamp(180px, 38vw, 320px);
      filter: drop-shadow(0 2px 20px rgba(0,0,0,0.6));
      animation:
        logoEntrance 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both,
        logoPulse 10s ease-in-out 1.5s infinite;
      transform-origin: center;
    }

    @keyframes logoEntrance {
      0%   { opacity: 0; transform: scale(0.88) translateY(-10px); filter: drop-shadow(0 0 0px rgba(242,209,102,0)); }
      60%  { opacity: 1; transform: scale(1.03) translateY(0);     filter: drop-shadow(0 0 30px rgba(242,209,102,0.5)); }
      100% { opacity: 1; transform: scale(1)    translateY(0);     filter: drop-shadow(0 2px 20px rgba(0,0,0,0.6)); }
    }

    /* Pulsa ogni 10s: i primi ~15% dell'animazione sono attivi, il resto è pausa */
    @keyframes logoPulse {
      0%   { transform: scale(1);    filter: drop-shadow(0 2px 20px rgba(0,0,0,0.4)); }
      7%   { transform: scale(1.05); filter: drop-shadow(0 0 36px rgba(242,209,102,0.65)); }
      15%  { transform: scale(1);    filter: drop-shadow(0 2px 20px rgba(0,0,0,0.4)); }
      100% { transform: scale(1);    filter: drop-shadow(0 2px 20px rgba(0,0,0,0.4)); }
    }

    .badge {
      font-family: 'Baloo 2', cursive;
      font-weight: 500;
      font-size: clamp(0.82rem, 1.6vw, 0.95rem);
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.20);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 5px 18px;
      border-radius: 999px;
      opacity: 0;
      animation: fadeSlideDown 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.9s forwards;
    }

    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── HEADLINE ── */
    .headline-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      opacity: 0;
      animation: riseIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) 1.1s forwards;
    }

    .headline-area h1 {
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: clamp(1.75rem, 4.5vw, 3.2rem);
      color: #fff;
      line-height: 1.1;
      max-width: 780px;
    }

    /* text-shadow sul padre rompe il gradient clip — lo mettiamo solo sullo span bianco */
    .headline-area h1 .white-text {
      display: block;
      text-shadow: 0 4px 40px rgba(0,0,0,0.9);
      white-space: nowrap;
    }

    .headline-area h1 em {
      font-style: normal;
      display: block;
      font-size: 1.22em;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(110deg, #F2D166 0%, #C8711A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-top: 0.05em;
    }

    .subtitle {
      max-width: 560px;
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      line-height: 1.75;
      color: rgba(255,255,255,0.48);
    }

    .subtitle strong {
      color: rgba(255,255,255,0.68);
      font-weight: 500;
    }

    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      font-size: clamp(0.68rem, 1.5vw, 0.78rem);
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .dots span { padding: 0 14px; }
    .dots span + span { border-left: 1px solid rgba(255,255,255,0.12); }

    /* ── FORM ── */
    .form-area {
      width: 100%;
      max-width: 420px;
      opacity: 0;
      animation: riseIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) 1.6s forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .glass-form {
      width: 100%;
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 18px;
      padding: 6px 6px 6px 20px;
      transition: border-color 0.3s;
    }

    .glass-form:focus-within {
      border-color: rgba(242, 209, 102, 0.4);
    }

    .glass-form input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 0.95rem;
      color: #fff;
      min-width: 0;
      padding: 10px 0;
    }

    .glass-form input::placeholder {
      color: rgba(255,255,255,0.3);
    }

    .glass-form button {
      flex-shrink: 0;
      background: linear-gradient(135deg, #F2D166 0%, #E3AA68 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 22px;
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.2s, transform 0.15s;
      white-space: nowrap;
    }

    .glass-form button:hover { opacity: 0.85; }
    .glass-form button:active { transform: scale(0.96); }

    .form-note {
      margin-top: 16px;
      font-size: clamp(0.78rem, 1.8vw, 0.86rem);
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.04em;
    }

    /* ── SUCCESS ── */
    .success {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .success-glow {
      font-size: 2.4rem;
      animation: glowPulse 2.2s ease infinite;
    }

    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 14px rgba(242,209,102,0.5)); }
      50%       { filter: drop-shadow(0 0 32px rgba(242,209,102,0.95)); }
    }

    .success h3 {
      font-family: 'Baloo 2', cursive;
      font-size: 1.4rem;
      background: linear-gradient(110deg, #F2D166, #E3AA68);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .success p {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.35);
    }

    /* ── FOOTER ── */
    .footer {
      position: relative;
      z-index: 2;
      padding-bottom: clamp(24px, 4vh, 40px);
      text-align: center;
      font-size: 0.68rem;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.07em;
    }

    /* ── ANIMATIONS ── */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── MOBILE ── */
    @media (max-width: 480px) {

      /* Fit in one screen senza scroll */
      .page {
        min-height: 100svh;
        height: 100dvh;
        justify-content: space-evenly;
        padding: 32px 20px 20px;
        gap: 0;
      }

      /* Logo più grande */
      .logo-area img.logo-wordmark {
        width: 72vw;
      }
      .logo-area { gap: 14px; }

      /* Badge leggibile */
      .badge {
        font-size: 0.92rem;
        letter-spacing: 0.28em;
        padding: 5px 14px;
      }

      /* H1: più grande, niente nowrap */
      .headline-area h1 {
        font-size: 1.7rem;
      }
      .headline-area h1 .white-text {
        white-space: normal;
      }
      .headline-area { gap: 40px; }

      /* Subtitle: testo ridotto e br rimosso visivamente */
      .subtitle {
        font-size: 0.98rem;
        line-height: 1.55;
      }
      .subtitle br { display: none; }

      /* Dots leggibili */
      .dots {
        font-size: 0.65rem;
        letter-spacing: 0.14em;
      }
      .dots span { padding: 0 10px; }

      /* Form */
      .glass-form {
        flex-direction: column;
        padding: 12px;
        gap: 10px;
        border-radius: 16px;
      }
      .glass-form input { width: 100%; text-align: center; padding: 8px 4px; }
      .glass-form button { width: 100%; border-radius: 10px; }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="page">

    <!-- LOGO -->
    <div class="logo-area">
      <img
        class="logo-wordmark"

        <strong>Se scatta un troompet significa che hai trovato la persona giusta.</strong>
      </p>

      <div class="dots">
        <span>Anonimo</span>
        <span>Autentico</span>
        <span>Reale</span>
      </div>
    </div>
